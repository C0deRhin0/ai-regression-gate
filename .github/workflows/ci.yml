name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,demo]'
      - run: ruff check .
      - run: argate --help
      - run: argate config validate
      - run: python -m pytest --cov=argate --cov-report=xml --cov-fail-under=80 -q
      - name: Prove regression blocks and fix passes
        run: python scripts/demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-reports-python-${{ matrix.python }}
          path: reports/demo
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps . -w dist
      - run: python -m pip install dist/*.whl
      - run: argate --help
# Capture a cleanup item for ci
